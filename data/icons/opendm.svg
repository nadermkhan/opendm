<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#76FF03"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Globe Circle -->
  <circle cx="64" cy="64" r="56" fill="url(#globeGrad)" filter="url(#dropShadow)"/>

  <!-- Globe Longitude/Latitude Grid lines -->
  <ellipse cx="64" cy="64" rx="30" ry="56" fill="none" stroke="#E3F2FD" stroke-width="2" stroke-opacity="0.4"/>
  <ellipse cx="64" cy="64" rx="56" ry="24" fill="none" stroke="#E3F2FD" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="8" y1="64" x2="120" y2="64" stroke="#E3F2FD" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="64" y1="8" x2="64" y2="120" stroke="#E3F2FD" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Downward Speed Download Arrow -->
  <g filter="url(#dropShadow)">
    <polygon points="64,106 32,60 52,60 52,24 76,24 76,60 96,60" fill="url(#arrowGrad)" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Speed Rings / Dynamic Pulses -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#00E676" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="8 6"/>
</svg>
