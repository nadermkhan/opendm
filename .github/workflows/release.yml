name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g., v1.0.0) when triggered manually'
        required: false
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (Win32 x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-zlib
            zip

      - name: Configure and Build (Win32)
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Run Unit & Integration Tests
        run: |
          ctest --test-dir build --output-on-failure -E YouTubeEngineTest

      - name: Bundle Windows Portable Release
        run: |
          STAGE_DIR="dist/OpenDM-Windows-x64"
          mkdir -p "${STAGE_DIR}"
          cp build/opendm.exe "${STAGE_DIR}/"
          cp build/opendm-native-host.exe "${STAGE_DIR}/"
          cp -r data "${STAGE_DIR}/"
          cp -r extension_extracted "${STAGE_DIR}/"
          cp opendm_extension.xpi LICENSE NOTICE README.md "${STAGE_DIR}/"

          # Bundle required MinGW64 runtime DLLs alongside opendm.exe
          ldd build/opendm.exe | awk '/\/mingw64\/bin\// { print $3 }' | sort -u | while read -r dll; do
            if [ -f "$dll" ]; then
              cp -n "$dll" "${STAGE_DIR}/"
            fi
          done
          # Copy standard SSL CA bundle if available in MinGW64
          if [ -f /mingw64/etc/ssl/certs/ca-bundle.crt ]; then
            mkdir -p "${STAGE_DIR}/ssl/certs"
            cp /mingw64/etc/ssl/certs/ca-bundle.crt "${STAGE_DIR}/ssl/certs/"
          fi

          cd dist
          zip -r9 OpenDM-Windows-x64.zip OpenDM-Windows-x64

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/OpenDM-Windows-x64.zip

  build-linux:
    name: Build Linux (GTK4 x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ pkg-config file dpkg-dev \
            libgtk-4-dev libcurl4-openssl-dev zlib1g-dev libssl-dev

      - name: Configure and Build (GTK4)
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)

      - name: Run Unit & Integration Tests
        run: |
          ctest --test-dir build --output-on-failure -E YouTubeEngineTest

      - name: Package Debian (.deb) and Portable Tarball
        run: |
          mkdir -p dist
          cpack --config build/CPackConfig.cmake -B dist
          for deb in dist/*.deb; do
            if [ -f "$deb" ]; then
              mv "$deb" dist/OpenDM-Linux-amd64.deb
              break
            fi
          done

          STAGE_DIR="dist/OpenDM-Linux-x86_64"
          mkdir -p "${STAGE_DIR}"
          cp build/opendm "${STAGE_DIR}/"
          cp build/opendm-native-host "${STAGE_DIR}/"
          cp -r data "${STAGE_DIR}/"
          cp src/ui/style.css "${STAGE_DIR}/data/"
          cp -r extension_extracted "${STAGE_DIR}/"
          cp install_desktop.sh opendm_extension.xpi LICENSE NOTICE README.md "${STAGE_DIR}/"
          tar -C dist -czf dist/OpenDM-Linux-x86_64.tar.gz OpenDM-Linux-x86_64

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/OpenDM-Linux-amd64.deb
            dist/OpenDM-Linux-x86_64.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare Release Assets & Checksums
        run: |
          cp opendm_extension.xpi release-assets/
          cd release-assets
          sha256sum OpenDM-Windows-x64.zip OpenDM-Linux-amd64.deb OpenDM-Linux-x86_64.tar.gz opendm_extension.xpi > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v1.0.0' }}
          name: OpenDM ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v1.0.0' }}
          generate_release_notes: true
          files: |
            release-assets/OpenDM-Windows-x64.zip
            release-assets/OpenDM-Linux-amd64.deb
            release-assets/OpenDM-Linux-x86_64.tar.gz
            release-assets/opendm_extension.xpi
            release-assets/SHA256SUMS.txt
