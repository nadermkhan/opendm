app-id: io.github.opendm.OpenDM
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: opendm

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: opendm
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ../../
